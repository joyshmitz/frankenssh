name: doc-drift

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-drift:
    name: Doc Contract Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check doc contract drift
        id: contracts
        continue-on-error: true
        run: bash scripts/check_doc_contract_drift.sh

      - name: Check review anchors
        id: anchors
        continue-on-error: true
        run: bash scripts/check_review_anchors.sh

      - name: Run governance gate tests
        id: gate_tests
        continue-on-error: true
        run: bash scripts/test_governance_gates.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-drift-reports
          path: |
            doc-contract-drift-report.json
            anchor-check-report.json
          retention-days: 30

      - name: Aggregate results
        if: always()
        run: |
          rc=0
          if [[ "${{ steps.contracts.outcome }}" == "failure" ]]; then
            echo "::error::doc-contract-drift check failed"
            rc=1
          fi
          if [[ "${{ steps.anchors.outcome }}" == "failure" ]]; then
            echo "::error::anchor-check failed"
            rc=1
          fi
          if [[ "${{ steps.gate_tests.outcome }}" == "failure" ]]; then
            echo "::error::governance gate tests failed"
            rc=1
          fi
          exit $rc
