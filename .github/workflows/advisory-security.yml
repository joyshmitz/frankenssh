name: advisory-security

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Advisory Gate (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo audit (advisory)
        id: audit
        uses: rustsec/audit-check@v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Emit advisory warning
        if: steps.audit.outcome == 'failure'
        run: echo "::warning::cargo audit found vulnerabilities"
